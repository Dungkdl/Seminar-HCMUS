name: ClinDistill software checks
on:
  push:
    branches: [main, "fix/**"]
  pull_request:
jobs:
  synthetic-checks:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      TOKENIZERS_PARALLELISM: "false"
    defaults:
      run:
        working-directory: "Khóa luận"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "setuptools>=68,<82" "wheel>=0.43"
      - run: python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[clinical,dev]"
      - run: python -m unittest discover -s _support/tests -p "test_*.py" -v
      - run: python -m clindistill plan --config configs/code/research_visual.json
