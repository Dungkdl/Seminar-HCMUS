[build-system]
requires = ["setuptools>=68,<82", "wheel>=0.43"]
build-backend = "setuptools.build_meta"

[project]
name = "clindistill-code"
version = "0.6.0"
description = "COde DINOv3 frozen MIL and group-OOF clinical knowledge distillation"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "Pillow", "matplotlib", "scikit-learn", "torch>=2.6", "torchvision>=0.21"]

[project.optional-dependencies]
clinical = ["transformers==4.57.1", "huggingface-hub==0.36.2", "safetensors>=0.4", "sentencepiece>=0.2"]
dev = ["nbformat>=5.9", "wheel>=0.43"]

[tool.setuptools.packages.find]
include = ["clindistill*"]
